spring.application.name=portal-facturas-s09
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portal_facturas}
spring.datasource.username=${DB_USER:portal_app}
spring.datasource.password=${DB_PASSWORD:PortalDB123!}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-stacktrace=never

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
portal.archivos.ruta=uploads/facturas
